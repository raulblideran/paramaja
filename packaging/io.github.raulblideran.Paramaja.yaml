# Flatpak manifest for Paramaja.
#
# The app is three pieces: the C#/Avalonia UI, the Rust torrent engine
# (libparamaja_torrent.so) and libmpv. The freedesktop runtime carries none of
# libmpv's stack beyond the basics, so most of this file builds it: libplacebo
# (the gpu-next renderer that does the HDR tonemapping), libass (subtitles),
# LuaJIT (the I statistics overlay is a Lua script), libXpresent (mpv's X11
# backend requires it), libdvdnav and libbluray (VIDEO_TS and BDMV folders)
# and ffmpeg itself.
#
# ffmpeg is rebuilt rather than taken from the runtime because the runtime's
# copy leaves out HEVC, H.264, AAC, AC-3/E-AC-3 and other patent-encumbered
# decoders, and playing everything is the point of a video player. mpv is
# GPL, which makes this bundle GPL-3.0-or-later.
app-id: io.github.raulblideran.Paramaja
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.dotnet8
command: paramaja

finish-args:
  # Avalonia 11 has no Wayland backend, so the window is X11 (XWayland on a
  # Wayland session). mpv renders into a child of that X11 window, which is
  # why the app forces mpv's x11vk context on Linux.
  - --socket=x11
  - --share=ipc
  - --device=dri                 # Vulkan rendering, VA-API/Vulkan decoding
  - --socket=pulseaudio
  # Torrents: trackers, DHT and peers, plus the localhost stream server mpv
  # reads from.
  - --share=network
  # Read-only access to everything, because the file chooser portal hands out
  # one file at a time: subtitles next to a video are auto-loaded by name, and
  # recent files and command-line paths have to open again later.
  - --filesystem=host:ro
  # Screenshots are saved to ~/Pictures/Paramaja.
  - --filesystem=xdg-pictures
  # Downloaded videos (YouTube and other sites) are saved to ~/Downloads.
  - --filesystem=xdg-download
  # Physical DVDs and Blu-rays: the optical drive (/dev/sr0) is a raw device.
  - --device=all

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /share/man
  - /share/doc
  - /share/lua
  - /bin/luajit*
  - '*.a'
  - '*.la'

modules:
  # ---- mpv's X11 backend requires XPresent; the runtime does not ship it ---
  - name: libXpresent
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://www.x.org/releases/individual/lib/libXpresent-1.0.1.tar.xz
        sha256: b964df9e5a066daa5e08d2dc82692c57ca27d00b8cc257e8e960c9f1cf26231b

  # ---- LuaJIT, for mpv's built-in stats overlay (the I key) -------------
  - name: luajit
    buildsystem: simple
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS PREFIX=/app amalg
      - make PREFIX=/app install
    sources:
      - type: git
        url: https://github.com/LuaJIT/LuaJIT.git
        commit: a4c064539ea931274d407e1249b4bb575424a0f4

  # ---- subtitles ---------------------------------------------------------
  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz
        sha256: 78f1179b838d025e9c26e8fef33f8092f65611444ffa1bfc0cfac6a33511a05a

  # ---- gpu-next: HDR -> SDR tonemapping, scaling, Dolby Vision ----------
  # The same release the app was developed and tested against. Shader
  # compilation goes through the runtime's shaderc.
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=enabled
      - -Dshaderc=enabled
      - -Dopengl=enabled
      - -Dlcms=enabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.360.1
        commit: 719cc95244a1f1d648dd72459822e026e6530f22

  # ---- ffmpeg, with every decoder ----------------------------------------
  # The ffmpeg and ffprobe programs are built too: yt-dlp needs them to merge the
  # separate video and audio streams of a download and to embed its cover art.
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-ffplay
      - --disable-doc
      - --disable-debug
      - --enable-gpl
      # OpenSSL 3 is Apache-2.0, which only GPLv3 can combine with -- and the
      # bundle is GPL-3.0-or-later already, because of mpv.
      - --enable-version3
      - --enable-openssl         # https:// streams
      - --enable-libdav1d
      - --enable-libdrm
      - --enable-vaapi
      - --enable-vulkan
      # NVENC off: the 25.08 runtime's nv-codec-headers 13 renamed a field
      # ffmpeg 8.0's nvenc.c still writes, so it fails to compile (the same
      # fix Apricot Studio needed). A player only decodes, and NVDEC/CUVID are
      # unaffected.
      - --disable-nvenc
    sources:
      # 8.0 because it is the release known to build against this runtime.
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.0.tar.xz
        sha256: b2751fccb6cc4c77708113cd78b561059b6fa904b24162fa0be2d60273d27b8e

  # ---- DVDs and Blu-rays ----------------------------------------------------
  # libdvdcss reads store-bought (CSS-encrypted) DVDs. Blu-ray encryption (AACS)
  # is not supported.
  - name: libdvdcss
    buildsystem: meson
    config-opts:
      - -Denable_docs=false
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdcss/1.6.0/libdvdcss-1.6.0.tar.xz
        sha256: 7ea556c846b7bfc32d47b41cae56d1863a6b6d5f706bb162778d6f298490977c

  - name: libdvdread
    buildsystem: meson
    config-opts:
      - -Denable_docs=false
      - -Dlibdvdcss=enabled
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdread/7.1.1/libdvdread-7.1.1.tar.xz
        sha256: a0d47876548bec806774bbf8dbf20bb19ba139464383156b32eb8e59915b90a9

  - name: libdvdnav
    buildsystem: meson
    config-opts:
      - -Denable_docs=false
      - -Denable_examples=false
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdnav/7.0.0/libdvdnav-7.0.0.tar.xz
        sha256: a2a18f5ad36d133c74bf9106b6445806fa253b09141a46392550394b647b221e

  - name: libudfread
    buildsystem: meson
    config-opts:
      - -Denable_examples=false
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libudfread/libudfread-1.2.0.tar.xz
        sha256: bb477cbd4cfbfc7787d9d05b71ee5e70430f5cfebf1297497f7e83547958050f

  # No BD-J (Java menus): titles play directly.
  - name: libbluray
    buildsystem: meson
    config-opts:
      - -Denable_docs=false
      - -Denable_tools=false
      - -Denable_examples=false
      - -Dbdj_jar=disabled
      - -Dembed_udfread=false
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libbluray/1.4.1/libbluray-1.4.1.tar.xz
        sha256: 76b5dc40097f28dca4ebb009c98ed51321b2927453f75cc72cf74acd09b9f449

  # ---- libmpv ------------------------------------------------------------
  # Only the library: the app is the player, so the mpv command-line binary,
  # its OSC and its manual are not built.
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=luajit
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
      - -Dx11=enabled
      - -Dwayland=enabled
      - -Dvulkan=enabled
      - -Degl=enabled
      - -Dvaapi=enabled
      - -Dpipewire=enabled
      - -Dpulse=enabled
      - -Dlcms2=enabled
      - -Dlibarchive=enabled
      - -Dlibbluray=enabled
      - -Ddvdnav=enabled
      - -Dcdda=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  # ---- libVLC: plays discs with their menus ------------------------------
  # mpv plays everything else but has no DVD or Blu-ray menu support, so discs
  # go through libVLC. Only the library is built (no VLC app or interfaces),
  # with the disc, FFmpeg and PulseAudio modules a disc player needs. VLC's own
  # libplacebo support is off: it predates the libplacebo mpv uses.
  - name: vlc
    build-options:
      env:
        BUILDCC: gcc -std=gnu99 # VLC builds a few helper tools with the native compiler
    config-opts:
      - --disable-vlc
      - --disable-qt
      - --disable-skins2
      - --disable-lua
      - --disable-ncurses
      - --disable-nls
      - --disable-a52
      - --disable-mad
      - --disable-mod
      - --disable-mpc
      - --disable-taglib
      - --disable-live555
      - --disable-libplacebo
      - --disable-decklink
      - --disable-jack
      - --disable-sndio
      - --disable-alsa
      - --disable-v4l2
      - --disable-vcd
      - --disable-libcddb
      - --disable-addonmanagermodules
      - --disable-vlm
      - --disable-sout
      - --disable-chromecast
      - --disable-update-check
      - --disable-wayland
      - --disable-dbus
      - --enable-dvdnav
      - --enable-dvdread
      - --enable-bluray
      - --enable-avcodec
      - --enable-avformat
      - --enable-swscale
      - --enable-pulse
    post-install:
      # The plugin cache makes libVLC start in milliseconds instead of scanning.
      - /app/lib/vlc/vlc-cache-gen /app/lib/vlc/plugins
    cleanup:
      - /share/vlc/lua
      - /share/applications
      - /share/icons
      - /share/metainfo
      - /share/kde4
      - /share/locale
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/vlc/3.0.24/vlc-3.0.24.tar.xz
        sha256: e7cab503d1d7d5849b89d2cf0e1ee60d0ef6d012407791b644b9cfc0cc225fdf

  # ---- the torrent engine (Rust) -----------------------------------------
  # Cargo needs its crates and a flatpak build has no network. --share=network
  # is fine for a local build; for Flathub, run
  # packaging/flatpak/generate-sources.sh, add cargo-sources.json to `sources`
  # and drop the build-args line.
  - name: paramaja-torrent
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/paramaja-torrent/cargo
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --lib --manifest-path native/paramaja-torrent/Cargo.toml
      - install -Dm755 native/paramaja-torrent/target/release/libparamaja_torrent.so -t /app/lib/paramaja/
    sources:
      - type: dir
        path: ..
        # The checkout's own build outputs: gigabytes, and none of them belong
        # in a clean build.
        skip:
          - .git
          - .flatpak-builder
          - build-dir
          - repo
          - dist
          - libs
          - native/paramaja-torrent/target
          - src/Paramaja.App/bin
          - src/Paramaja.App/obj
          - src/Paramaja.Core/bin
          - src/Paramaja.Core/obj
          - tests

  # ---- the application (C# / Avalonia) -----------------------------------
  # Published self-contained, so the .NET runtime travels with the app rather
  # than being another extension to install. Same network note as above, with
  # nuget-sources.json from the same script.
  - name: paramaja
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/dotnet8/bin
      append-ld-library-path: /usr/lib/sdk/dotnet8/lib
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
        DOTNET_NOLOGO: 'true'
        DOTNET_CLI_HOME: /run/build/paramaja
        NUGET_PACKAGES: /run/build/paramaja/nuget
      build-args:
        - --share=network
    build-commands:
      - dotnet publish src/Paramaja.App -c Release -r linux-x64 --self-contained true
        -p:DebugType=none -p:ParamajaNativeRid=none -o /app/lib/paramaja
      - install -Dm755 packaging/flatpak/paramaja.sh /app/bin/paramaja
      # YouTube and other sites: yt-dlp, QuickJS (the JavaScript runtime YouTube
      # needs) and ffmpeg (merges downloads), where the app looks for them.
      - install -Dm755 yt-dlp_linux /app/lib/paramaja/yt-dlp
      - install -Dm755 qjs-linux-x86_64 /app/lib/paramaja/qjs
      - ln -sf /app/bin/ffmpeg /app/lib/paramaja/ffmpeg
      - ln -sf /app/bin/ffprobe /app/lib/paramaja/ffprobe
      - install -Dm644 packaging/io.github.raulblideran.Paramaja.svg
        -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 src/Paramaja.App/Assets/paramaja-256.png
        /app/share/icons/hicolor/256x256/apps/io.github.raulblideran.Paramaja.png
      - install -Dm644 packaging/io.github.raulblideran.Paramaja.desktop
        -t /app/share/applications/
      - install -Dm644 packaging/io.github.raulblideran.Paramaja.metainfo.xml
        -t /app/share/metainfo/
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp_linux
        sha256: 58162f9bfdc27458ea47bfcb311cf47028f17d8154a8bf7d689861d46399230a
      - type: file
        url: https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/qjs-linux-x86_64
        sha256: 0bfc02511a9f549c28b53880d988fc7cd5d361e90c5e8afdfcd7dc6774ceace5
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - build-dir
          - repo
          - dist
          - libs
          - native/paramaja-torrent/target
          - src/Paramaja.App/bin
          - src/Paramaja.App/obj
          - src/Paramaja.Core/bin
          - src/Paramaja.Core/obj
          - tests
