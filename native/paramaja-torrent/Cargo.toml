[package]
name = "paramaja-torrent"
version = "0.1.0"
edition = "2024"
description = "Torrent streaming engine for Paramaja (librqbit + localhost HTTP range server + C ABI)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
axum = "0.8"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
lto = "thin"
strip = true
