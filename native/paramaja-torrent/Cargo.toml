[package]
name = "paramaja-torrent"
version = "0.1.0"
edition = "2024"
description = "Torrent streaming engine for Paramaja (librqbit + localhost HTTP range server + C ABI)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.8"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
cbc = "0.1"
ctr = "0.9"
futures = "0.3"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
lto = "thin"
strip = true

# librqbit 9.0.1 with one change: a configurable stream lookahead (see
# vendor/PARAMAJA-librqbit.patch). Everything else is the crates.io release.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
