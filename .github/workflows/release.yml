# Publishes a GitHub Release when a version tag is pushed:
#   ./build/bump-version.sh 1.3.3 "Summary"   # then fill in CHANGELOG.md and commit
#   git tag v1.3.3 && git push origin main v1.3.3
# Builds the portable Windows zip and the Flatpak bundle from that commit, the same way
# build/publish-win.sh and build/publish-flatpak.sh do locally. Both builds start at once;
# the Release is published as soon as the Windows zip is ready (a few minutes), so it can be
# shared right away, and the Flatpak is attached to it when its longer build finishes.
# The notes are the version's CHANGELOG.md section (build/release-notes.sh).
name: release
on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # A tag that doesn't match the project version would publish a mislabelled build.
      - id: v
        run: |
          VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/Paramaja.App/Paramaja.App.csproj)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but the project is $VERSION"; exit 1; }
          grep -q "^## $VERSION " CHANGELOG.md || { echo "::error::CHANGELOG.md has no $VERSION section"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    # Built on Windows: Rust, 7-Zip, CMake and NASM are preinstalled there, so nothing has to
    # come from Ubuntu's package mirror (which stalled for 40+ minutes on two releases).
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: ./build/publish-win.sh
      # Named after the file inside, so a download from the run page says what it is.
      - uses: actions/upload-artifact@v4
        with:
          name: Paramaja-${{ needs.check.outputs.version }}-portable-win-x64
          path: dist/Paramaja-${{ needs.check.outputs.version }}-portable-win-x64.zip
          if-no-files-found: error

  flatpak:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # Caches the built FFmpeg, libplacebo, mpv and friends; only the app is rebuilt
      # until the manifest's other modules change.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: packaging/io.github.raulblideran.Paramaja.yaml
          bundle: paramaja-${{ needs.check.outputs.version }}.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/io.github.raulblideran.Paramaja.yaml') }}
          artifact-name: paramaja-${{ needs.check.outputs.version }}-flatpak

  # Publishes with the Windows zip only; doesn't wait for the Flatpak.
  release:
    needs: [check, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: "Paramaja-${{ needs.check.outputs.version }}-portable-win-x64", path: assets }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./build/release-notes.sh "${{ needs.check.outputs.version }}" linux-pending > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" assets/*.zip \
            --title "Paramaja ${{ needs.check.outputs.version }}" --notes-file notes.md

  # Attaches the Flatpak once built, and takes the "still building" line out of the notes.
  # Runs even if the Flatpak failed, to say so in the notes instead.
  linux:
    needs: [check, release, flatpak]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ needs.flatpak.result == 'success' }}
        with: { pattern: "paramaja-${{ needs.check.outputs.version }}-flatpak*", path: assets, merge-multiple: true }
      - name: Attach the Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          if [ "${{ needs.flatpak.result }}" = success ]; then
            gh release upload "$GITHUB_REF_NAME" assets/*.flatpak
            ./build/release-notes.sh "$VERSION" > notes.md
          else
            ./build/release-notes.sh "$VERSION" linux-failed > notes.md
          fi
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          [ "${{ needs.flatpak.result }}" = success ]
