name: Tests
# Branch pushes and pull requests only: a release pushes main and its tag together, and
# the tag's commit is the one main was just tested at. Changes that can't affect the app
# (docs, the release and cache workflows) don't need a test run.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "prompts/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/flatpak-cache.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "prompts/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/flatpak-cache.yml"

# A newer push to the same branch makes an unfinished run of the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Time limits a few times the usual run, so a hung step fails fast instead of after 6 hours.
  linux:
    name: Tests · Linux (engine, playback, UI)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: dtolnay/rust-toolchain@stable
      # Only what the tests use: ffmpeg makes the fixtures, libmpv2 plays them. Skipping
      # recommends and the man-db index rebuild keeps the install quick. GitHub's Ubuntu
      # mirror has stalled mid-download for 15+ minutes (trickling, so apt's own timeouts
      # don't fire): give it 4 minutes, then switch to Ubuntu's main archive and try again.
      - name: Install ffmpeg and libmpv
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          install() { sudo timeout 240 apt-get $APT install -y --no-install-recommends ffmpeg libmpv2; }
          sudo timeout 120 apt-get $APT update
          if ! install; then
            echo "::warning::GitHub's Ubuntu mirror stalled; retrying from archive.ubuntu.com"
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            sudo apt-get $APT update
            install
          fi
      - run: ./build/test.sh

  # Tests only: the Windows zip itself is built by the Release workflow.
  windows:
    name: Tests · Windows (engine, UI)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Torrent engine tests
        working-directory: native/paramaja-torrent
        run: cargo test --lib
      - name: UI and view model tests
        run: dotnet test tests/Paramaja.App.Tests --logger GitHubActions
      # The DVD ripper's libdvdread and libdvdcss, as the Windows zip ships them (build/build-dvdread-win.sh).
      - name: DVD reading (libdvdread)
        env:
          PARAMAJA_NATIVE_DIR: ${{ github.workspace }}/packaging/dvd/win64
          PARAMAJA_REQUIRE_DVDREAD: "1"
        run: dotnet test tests/Paramaja.Core.Tests --filter "FullyQualifiedName~DvdReadNativeTests" --logger GitHubActions
