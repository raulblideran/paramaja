name: ci
# Branch pushes and pull requests only: a release pushes main and its tag together, and
# the tag's commit is the one main was just tested at. Changes that can't affect the app
# (docs, the release and cache workflows) don't need a test run.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "prompts/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/flatpak-cache.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "prompts/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/flatpak-cache.yml"

# A newer push to the same branch makes an unfinished run of the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Time limits a few times the usual run, so a hung step fails fast instead of after 6 hours.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: dtolnay/rust-toolchain@stable
      # Only what the tests use: ffmpeg makes the fixtures, libmpv2 plays them. Skipping
      # recommends and the man-db index rebuild keeps the install quick. The mirror has
      # stalled mid-download before: a 30 s stall aborts that download and retries it.
      - run: |
          sudo rm -f /var/lib/man-db/auto-update
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends ffmpeg libmpv2
      - run: ./build/test.sh

  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build torrent engine
        working-directory: native/paramaja-torrent
        run: cargo build --release && cargo test --lib
      - name: Fetch libmpv
        shell: bash
        run: |
          mkdir -p libs/win-x64
          cp native/paramaja-torrent/target/release/paramaja_torrent.dll libs/win-x64/
          curl -fL -o mpv.7z https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
          7z e -y -olibs/win-x64 mpv.7z libmpv-2.dll
      - run: dotnet test tests/Paramaja.App.Tests --logger GitHubActions
      - run: dotnet publish src/Paramaja.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false -p:DebugType=none -o dist/Paramaja
      - uses: actions/upload-artifact@v4
        with: { name: Paramaja-portable-win-x64, path: dist/Paramaja }
